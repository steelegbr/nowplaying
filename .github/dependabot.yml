
version: 2

updates:
  # Keep GitHub Actions runners and actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep Swift Package Manager dependencies up to date
  - package-ecosystem: swift
    directory: /NowPlayingClient
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns:
          - "*"
