
name: Container Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: container-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-server:
    runs-on: ubuntu-latest
    name: Build Server Container
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:NowPlaying"
          push: false
          tags: nowplaying-server:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=nowplaying-server
          cache-to: type=gha,scope=nowplaying-server,mode=max

  build-web-ui:
    runs-on: ubuntu-latest
    name: Build Web UI Container
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web UI Image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:now-playing-frontend"
          push: false
          tags: nowplaying-web-ui:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=nowplaying-web-ui
          cache-to: type=gha,scope=nowplaying-web-ui,mode=max
